# Provenance of the Sail-extracted RISC-V model — the trust anchor's pin record.
#
# SKELETON (staged 2026-06-24, pre-P1). The `[current]` block records what the
# project consumes TODAY (the dhsorens fork, unscoped full RV64D). The `[target]`
# block is the foundation P1/P2 will establish (pinned, scoped, vendored).
#
# The pin gate `scripts/check-sail-pin.sh` NOW EXISTS and runs in CI
# (.github/workflows/build.yml, source-checks). It recomputes `model_sha256` and
# `config_sha256` by the recipe pinned below and fails on any drift, so a
# hand-edit under `vendor/sail-riscv-zkvm-lean/` no longer passes silently.
# Re-pin after a deliberate regen with `scripts/check-sail-pin.sh --write`.
#
# See docs/sail-zkvm-implementation-plan.md (P2.3) and docs/sail-zkvm-model-review.md §6.

[current]
# What lakefile.toml + lake-manifest.json resolve to right now.
# MIGRATED (2026-06-25, P2 steps 3-4, commit pending): the project now consumes the
# VENDORED model — `[current]` == `[target]`. The dhsorens fork is GONE from
# lakefile.toml + lake-manifest.json. See [target] for the authoritative pins.
source          = "vendor/sail-riscv-zkvm-lean"   # local path require (package "out", lib "Out")
lean_sail_rev   = "79b4d08505af29d88b3918f32d29840fae1fa191"   # = lean-sail v4; pinned by the vendored package's lakefile
scope           = ["main", "I_insts", "M_insts", "Zicsr_insts"]   # RV64IM + Zicsr (116 Lean files; Zicsr_insts restores currentlyEnabled's Ext_Zicsr arm — #10688)
project_toolchain = "leanprover/lean4:v4.30.0-rc1"
notes = "Repointed off dhsorens onto the vendored release-pinned model. lean-sail v4 + mathlib-master proven to coexist in the real evm-asm build; all 51 *_sail_equiv lemmas green (rename was 100% mechanical LeanRV64D->Out). AXIOM FOOTPRINT (corrected 2026-06-25 adversarial review, docs/agents/sail-adversarial-review.md F1): pure-ALU lemmas reduce to {propext, Classical.choice, Quot.sound}; memory lemmas additionally carry Sail PLATFORM axioms {plat_term_write, load_reservation, match_reservation, sys_enable_experimental_extensions} (host/LR-SC/experimental-ext boundary). The earlier '3 classical only' note was inaccurate for mem ops. (F2 RESOLVED: the model_sha256 below is correct; only its recipe was underspecified — pinned reproducibly at the hash line.)"

