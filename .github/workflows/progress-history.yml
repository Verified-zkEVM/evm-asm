name: Progress History

# Appends one kernel-checked progress snapshot per NIGHT to the long-lived
# `progress-history` orphan branch (R-A5, Phase 2 D2). The series is read by
# `scripts/progress-velocity.sh` to surface velocity + the DIV-style
# silent-downgrade regression alarm. Mirrors the `benchmark-history` pattern in
# benchmark.yml.
#
# ⚠️ GRANULARITY CHANGED IN #12683, deliberately and with the tradeoff accepted.
# This used to run on every push to `main` and needed NO Lean build, because the
# counts came from the committed, drift-gated PROGRESS.md. That file is a
# generated artifact and was removed from the tree (it conflicted on every
# concurrent PR that regenerated it), so the snapshot now RENDERS the report
# itself — `scripts/progress-report.sh --write` into $RUNNER_TEMP, never into
# the checkout — which costs a Lean build. Per-merge granularity is therefore
# traded for per-day granularity: a datapoint is one night, not one merge, and
# `commit` records whichever `main` HEAD the nightly saw. Two consequences to
# keep in mind when reading the series: a day with several merges collapses to
# one point, and a change that lands and is reverted the same day can be
# invisible. The regression alarm in progress-velocity.sh still fires, one day
# later at worst.
#
# TODO(#12683): step 3 is posting this night's render as a GitHub Discussion.
# NOT implemented here — the Discussion category has not been decided yet. When
# it is, the render already produced by the "Render progress report" step below
# is the body to post; nothing else needs to change.

on:
  schedule:
    # 04:17 UTC. Off the hour to avoid the top-of-hour scheduler pileup, and
    # after the usual merge day so a night's point reflects the day's work.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Serialize so a manual dispatch can't race the scheduled run.
concurrency:
  group: progress-history
  cancel-in-progress: false

# Needs write to push the snapshot to the `progress-history` orphan branch
# (mirrors benchmark.yml — without this the default GITHUB_TOKEN is read-only
# and the push silently fails).
permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Raised from 15: this job now builds Lean (see the granularity note above).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same restore-only scheme as build.yml, split the same two ways
      # (#12798). This job never SAVES -- only push/merge_group/dispatch runs of
      # build.yml do, so the nightly cannot churn the 10 GB quota or evict the
      # main-branch entries (#1441).
      #
      # KEEP IN SYNC with build.yml: actions/cache hashes each path list into
      # that entry's version, so a restore list that does not match its save
      # list silently stops matching the entry.
      - name: Restore dependency cache (.lake/packages)
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - name: Restore lake build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          # Same reasoning as build.yml: on an exact deps-cache hit the
          # mathlib build artifacts are already present and `lake exe cache
          # get` is ~15 s of no-op. On a miss it runs exactly as before.
          use-mathlib-cache: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
          use-github-cache: false
          lake-package-directory: .
          # Installs elan + fetches the mathlib cache only; we build below.
          build: "false"

      - name: Render progress report
        run: |
          set -euo pipefail
          # The renderer's own helper (scripts/lib/report-fresh-lean.sh) forces
          # a non-cache `lake build MainProgress` and refuses a short/stale
          # report, so a broken build fails this step instead of silently
          # snapshotting older figures.
          scripts/progress-report.sh --write "$RUNNER_TEMP/PROGRESS.md"

      - name: Emit snapshot record
        run: |
          set -euo pipefail
          # Write the record to a file rather than round-tripping a JSON string
          # through $GITHUB_OUTPUT (which splits on `=` and mangles multi-line /
          # special content). $RUNNER_TEMP persists across steps in this job.
          scripts/progress-snapshot.sh --report "$RUNNER_TEMP/PROGRESS.md" \
            > "$RUNNER_TEMP/record.json"
          cat "$RUNNER_TEMP/record.json"

      - name: Persist record to progress-history branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RECORD="$(cat "$RUNNER_TEMP/record.json")"
          # Fresh working tree at a temp path so we don't disturb the checkout.
          tmpdir=$(mktemp -d)
          git -c protocol.version=2 clone --no-checkout --filter=blob:none \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$tmpdir/history"
          cd "$tmpdir/history"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin progress-history >/dev/null 2>&1; then
            git fetch --depth=1 origin progress-history
            git checkout progress-history
          else
            git checkout --orphan progress-history
            git rm -rf --quiet . 2>/dev/null || true
            printf '%s\n' \
              '# progress-history' \
              '' \
              'Append-only nightly snapshots of the kernel-checked progress' \
              'registry (per-commit before #12683), emitted by' \
              '`scripts/progress-snapshot.sh` from' \
              '`.github/workflows/progress-history.yml` (steering Phase 2, R-A5).' \
              '' \
              'One JSON object per line in `history.jsonl` — see' \
              '`scripts/progress-snapshot.sh` for the field list. Read with' \
              '`scripts/progress-velocity.sh history.jsonl`.' \
              > README.md
            : > history.jsonl
          fi
          # Drop any prior record for this commit, then append — keeps the log
          # one-record-per-commit even when a workflow_dispatch re-runs on the
          # same `main` HEAD (the common case for a nightly on a quiet day).
          append() {
            { grep -v "\"commit\":\"${GITHUB_SHA}\"" history.jsonl || true; } \
              > history.jsonl.tmp
            mv history.jsonl.tmp history.jsonl
            printf '%s\n' "$RECORD" >> history.jsonl
          }
          append
          git add history.jsonl README.md
          git commit -m "progress: ${GITHUB_SHA::12}" --allow-empty
          # Push with retries (no rebase, per project policy): on rejection,
          # re-fetch, reset, re-append, recommit, retry with backoff.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin progress-history; then
              echo "history push: ok on attempt $attempt"
              pushed=1
              break
            fi
            echo "history push: attempt $attempt failed, refetching + re-applying" >&2
            git fetch origin progress-history
            git reset --hard origin/progress-history
            append
            git add history.jsonl README.md
            git commit -m "progress: ${GITHUB_SHA::12}" --allow-empty
            sleep 5
          done
          if [[ "$pushed" -ne 1 ]]; then
            echo "history push: FAILED after 3 attempts — snapshot not persisted" >&2
            exit 1
          fi
          # Advisory post-merge velocity signal (does NOT gate — see the script
          # header; PR-time gating is a Phase 4 follow-up). Surface it in the
          # job summary so a silent downgrade is at least visible on main.
          {
            echo '### Progress velocity (advisory)'
            echo '```'
            # The orphan-branch worktree has only history.jsonl + README; the
            # script lives in the main checkout.
            "$GITHUB_WORKSPACE/scripts/progress-velocity.sh" history.jsonl || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
