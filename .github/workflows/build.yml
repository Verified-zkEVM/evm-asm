name: Build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Forbidden-tactic guard (no bv_decide / native_decide / TCB expanders)
        run: scripts/check-forbidden-tactics.sh
      - name: Retired-predicate absence guard (#11596)
        run: |
          scripts/check-retired-predicates.sh --self-test
          scripts/check-retired-predicates.sh
      - name: Symbolic guest-PC guard (SAsm wrappers follow GuestAddrs)
        run: scripts/check-no-hardcoded-guest-pc.sh
      - name: Layout-literal ratchet (layout addresses follow MemoryLayout, #12586)
        run: scripts/check-layout-literals.sh
      - name: GuestAddrs declared-start match (GuestAddrs.lean vs symbol-addresses.tsv)
        run: scripts/check-guestaddrs-starts.sh
      # #12166 / #10552: a phase hypothesis may only be stated at
      # `guestImageCodeReq` once that phase's ENTRY PC is pinned by it —
      # `cpsTripleWithin_needs_entry_code` makes an unpinned entry
      # UNSATISFIABLE, i.e. the statement is FALSE and elaborates fine. This
      # keeps the pinned/unpinned answer live instead of a one-time
      # measurement. Self-test first: the probe must be able to say PINNED.
      - name: "Phase entry pinned by guestImageCodeReq (#12166)"
        run: |
          python3 scripts/check-phase-entry-pinned.py --self-test
          python3 scripts/check-phase-entry-pinned.py --check
      - name: File-size guardrail
        run: scripts/check-file-size.sh
      # Deterministic build-cost ratchet (#12788). Fails only when a graph
      # number goes UP: cone size per anchor, total invalidation mass, and DAG
      # depth are pure functions of the import graph, so unlike the wall-clock
      # series in benchmark.yml there is no runner noise to absorb and no
      # tolerance band is needed. Self-test first — it pins the import-line
      # grammar (`public import`, `meta`, `all`, trailing `-- shake:` comments)
      # and asserts the ratchet fires on a rise but not on an improvement.
      - name: Import-graph build-cost ratchet (#12788)
        run: |
          python3 scripts/import-graph-metrics.py --self-test
          python3 scripts/import-graph-metrics.py --check
      - name: Unimported-file check
        run: scripts/check-unimported.sh
      - name: Correspondence-harness import budget (keeps the oracle gate cheap)
        run: |
          scripts/check-correspondence-deps.sh --self-test
          scripts/check-correspondence-deps.sh
      - name: EEST sampler span check (negative control on the --random guard)
        run: scripts/check-eest-sampler-span.py
      - name: "Guest-ELF override guard (negative control; an ignored override ran the default guest, #10617)"
        run: scripts/check-guest-elf-override.sh
      # Conventions-as-fitness-functions (Phase 5 / R-D1). Pure source scans,
      # no build needed — kept cheap on the PR push path. See AGENTS.md
      # "Architecture fitness functions".
      - name: Heartbeat-override allowlist (maxHeartbeats is a ceiling, not a license)
        run: scripts/check-heartbeats-approved.sh
      - name: "Routine liveness (a theorem's subject must be referenced or annotated, #11303)"
        run: |
          scripts/check-routine-liveness.sh --self-test
          scripts/check-routine-liveness.sh
      - name: "jalOff closure (registered image closed under direct calls, #12403; holes #12705)"
        run: |
          scripts/check-jaloff-closure.sh --self-test
          scripts/check-jaloff-closure.sh
      - name: "Registry cross-check (witnessed routine must not be .unproven, #11294)"
        run: |
          scripts/check-registry-crosscheck.sh --self-test
          scripts/check-registry-crosscheck.sh
      # Self-test first: it plants `public import EvmAsm.Codegen.*` in a real core
      # file and demands a real failure. Before #12793 that form matched none of
      # L1's patterns, so the gate printed "(clean)" and exited 0 with the
      # violation standing — a false GREEN on a soundness boundary.
      - name: Layering invariants (verified core must not import Codegen / Progress)
        run: |
          scripts/check-layering.sh --self-test
          scripts/check-layering.sh
      # Self-test first, for the same reason layering has one: this gate scans
      # source and prints a count, so it can report a clean tree because its own
      # matcher missed the thing it exists to find.
      - name: No declaration is declared in two modules (MODULES.md §5d)
        run: |
          python3 scripts/check-duplicate-decls.py --self-test
          python3 scripts/check-duplicate-decls.py
      - name: "code_at_header empty-hash guard (#11520; raise→reject, not fallback)"
        run: scripts/check-code-preimage-empty-hash.sh
      - name: check-mpt-status-vocab
        run: scripts/check-mpt-status-vocab.sh
      # #12829: every standalone Function/Program render needs an external
      # oracle; a *_eq_prog self-tie alone cannot detect shared drift.
      - name: Guarded render oracle coverage
        run: |
          python3 scripts/check-render-oracle-coverage.py --self-test
          python3 scripts/check-render-oracle-coverage.py
      - name: Opcode-structure (AddrNorm pairing; advisory checklist for new complex dirs)
        run: scripts/check-opcode-structure.sh
      # Advisory naming nudge (camelCase hypotheses newly added in the PR);
      # always exits 0, surfaces the PR #1497 regression class for review.
      - name: Naming convention scan (advisory)
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/check-naming.sh --base "origin/${{ github.base_ref }}"
      # #11517: `reference` line numbers in the correspondence registry rot as SpecRef
      # modules grow, and check-spec-refs.sh validates PYTHON citations only. Two had
      # drifted into unrelated code. Pure source scan, no build. Self-test first, since
      # catching a wrong-line citation is this gate's whole purpose.
      #
      # `--strict` since #12931. Without it the script printed its findings and
      # exited 0, so four citations sat drifted on green CI -- the gate was wired
      # but could not fail, which is indistinguishable from not having it.
      - name: SpecRef citation drift
        run: |
          scripts/check-specref-citations.py --self-test
          scripts/check-specref-citations.py --strict

      # #12931 fixed one gate that had been wired but unable to fail; this is
      # the companion that makes the class impossible to reintroduce. Pure
      # source scan over the workflows + scripts/, no build. Self-test first:
      # it plants two silent gates and runs the whole check over them, since a
      # self-test that only exercises the regexes has the #12907 hole.
      - name: Every wired gate can fail
        run: |
          scripts/check-gates-can-fail.py --self-test
          scripts/check-gates-can-fail.py

      # #13056: the independent fixed-sink scan must agree with the union of
      # this manifest and check-derived-artifacts.py's guest-code registry.
      # Its self-test proves that deleting an owner row and adding an unknown
      # writer both fail; dynamic/temp/manual sinks remain explicitly named in
      # the manifest scope rather than being guessed.
      - name: Artifact-writer ownership (manifest + independent scan)
        run: |
          python3 scripts/check-artifact-writer-ownership.py --self-test
          python3 scripts/check-artifact-writer-ownership.py

  build:
    runs-on: ubuntu-latest
    # Was inheriting the 360-minute default; the cache-miss run on
    # 2026-08-22 already burned 112 min. 180 still clears a cold build.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      # TWO cache entries, deliberately keyed differently (#12798). One
      # combined `.lake` entry put the repo at ~13.2 GiB against the 10 GB quota,
      # so entries evicted each other on every push and PRs restored an
      # ever-more-distant ancestor -- presenting as "CI is slow sometimes"
      # rather than as a quota problem.
      #
      # Splitting by CHANGE RATE keeps the bulky, rarely-changing parts out of
      # the per-commit churn:
      #
      #   packages  7.8 GiB, 58% of the tree (mathlib alone 7.1 GiB) -- changes
      #             only when the version lock changes.
      #   build     our own artifacts -- changes every commit.
      #
      # riscv-zkvm is a tagged dependency with a Lake release archive. Its
      # generated `Out` oleans arrive through the dependency cache/archive and
      # need no separate in-tree cache entry.
      #
      # KEEP IN SYNC: actions/cache hashes each path list into that entry's
      # *version* (getCacheVersion, actions/toolkit packages/cache), so a
      # restore list must match its save list exactly, here and in
      # progress-history.yml, or the entry will not match.
      - name: Restore dependency cache (.lake/packages)
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          # No commit component and no restore-keys: the version lock fully
          # determines the dependency set, so a hit is exact or it is a miss --
          # a near-miss would be worse than useless here. Written once per
          # version-lock bump instead of once per push.
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      # Our own build artifacts: per-commit with restore-keys, as before. Now
      # that the bulky entries above are not re-uploaded on every push, several
      # of these fit in the quota the dependency entry used to churn through, so
      # a PR restores a NEARER ancestor and rebuilds less.
      - name: Restore lake build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}

      - uses: leanprover/lean-action@v1
        with:
          # Only fetch the mathlib cache when the dependency restore above
          # MISSED. On a hit, .lake/packages/mathlib/.lake/build is already
          # present and `lake exe cache get` downloads nothing -- measured 15 s
          # of pure overhead per warm run (lean-action step timing, dispatch
          # 32732900255: 17 s install elan + 15 s get mathlib cache = 33 s).
          #
          # This is only safe BECAUSE of the split above. The deps entry is
          # keyed on lean-toolchain + lake-manifest.json with no commit
          # component and no restore-keys, so a hit is exact by construction:
          # if it hit, the mathlib build artifacts it contains are the ones this
          # toolchain and manifest ask for. On a miss -- version bump, eviction,
          # or a fork without cache access -- the fetch runs as before, so the
          # fallback is the current behaviour and never a mathlib source build.
          use-mathlib-cache: ${{ steps.deps-cache.outputs.cache-hit != 'true' }}
          # We manage the GitHub Actions cache ourselves (steps above + below)
          # so that PR runs only RESTORE while push/merge_group runs SAVE. The
          # lean-action default saves on every event, which combined with the
          # 10 GB per-repo cache quota and ~3.4 GB cache size was evicting the
          # main cache within ~24 h. See #1441.
          #
          # Measured 2026-08-24 on the first saving run of the two-path entry
          # (workflow_dispatch 32722855049): 3379 MiB, against 3366 MiB for the
          # root .lake alone. Adding the vendored tree costs ~13 MiB, so it does
          # not move the eviction picture. The quota itself is a separate and
          # LIVE problem, tracked in #12798: the repo sits at ~13.2 GiB active
          # against the 10 GB quota, so entries are already being evicted.
          use-github-cache: false
          lake-package-directory: .
          # Skip the inner `lake build` — we run our own in the next step
          # so we can capture stdout/stderr for the no-warnings guard.
          # lean-action still installs elan and fetches the mathlib cache.
          build: "false"

      - name: Lake build (with log capture)
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log

      - name: No-warnings guard (EvmAsm/ source paths)
        run: scripts/check-no-warnings.sh build.log

      # #13013/#13015: the callee-composition worklist is a verifier-backed
      # instrument, not a report-only script.  Its self-test needs the
      # Program-derived shape dump, so generate that input only after its Lean
      # producer has been built.  Exercise the missing-input path first: a
      # self-test that silently accepts an absent dump is a green no-op.  The
      # planted controls and the current-tree regression pins are hard failures:
      # when the tree improves past an exemplar, update the pin or replace it
      # with a population invariant rather than weakening the check.
      - name: Callee-composition shape dump and self-test
        run: |
          set -euo pipefail
          shape_dump="$RUNNER_TEMP/evm-asm-shape.tsv"
          rm -f "$shape_dump"
          if python3 scripts/callee-composition-queue.py --tsv "$shape_dump" --self-test; then
            echo "::error::callee-composition self-test unexpectedly accepted a missing shape dump"
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::missing shape dump returned $status, expected hard-failure status 2"
              exit "$status"
            fi
          fi
          LAKE_ARTIFACT_CACHE=false lake build EvmAsm.Tests.GuestImageShapeDump
          LAKE_ARTIFACT_CACHE=false lake env lean scripts/lean/GuestImageShapeDumpRun.lean > "$shape_dump"
          test -s "$shape_dump"
          python3 scripts/callee-composition-queue.py --tsv "$shape_dump" --self-test

      # Runs here, not in source-checks: re-deriving the export lists needs the
      # dependency's oleans, so it requires a build. Without this gate a
      # declaration added upstream would simply never surface under
      # `EvmAsm.Rv64`, and the first sign would be an unrelated-looking
      # "unknown identifier" in whichever proof happened to need it next.
      - name: Rv64 re-export shims match the riscv-zkvm dependency
        run: python3 scripts/gen-rv64-shims.py --check

      # Moved out of source-checks: `Instr` now lives in the dependency, so this
      # reads .lake/packages/riscv-zkvm and needs a populated package dir.
      - name: Round-trip coverage fence (every Instr ctor has a #guard)
        run: scripts/check-roundtrip-coverage.sh

      # These executables are not defaultTargets. Build them before launching
      # their independent checks concurrently, avoiding concurrent Lake writes.
      - name: Build CI executables
        run: lake build codegen progress-report arith-diff-check correspondence-check axiomsweep satsweep footsweep

      # Replays the committed oracle corpora against their Lean models — the
      # evidence behind the verdicts in docs/*-spec-correspondence.md and the
      # registry in EvmAsm/Progress/Correspondence.lean. No Python needed here:
      # corpora are generated locally and committed (some references, e.g.
      # ethereum_rlp, are external PyPI packages and are not vendored).
      # Self-tests for EVERY registered family run first, so a checker that
      # cannot catch a planted violation fails loudly rather than passing
      # vacuously. Method: docs/agents/spec-correspondence.md
      - name: Spec-correspondence (oracle replay)
        run: |
          lake exe correspondence-check --self-test
          lake exe correspondence-check rlp
          lake exe correspondence-check bal

      - name: Install RISC-V binutils for codegen link checks
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf
          # #12572: check-doc-links.sh (added below) shells out to ripgrep;
          # not guaranteed present on the runner image, so install explicitly
          # rather than relying on it (other scripts using `rg` degrade
          # silently on a missing binary via `|| true` / an `if` guard, so
          # this gap went unnoticed until a gate that fails loud hit it).
          sudo apt-get install -y ripgrep

      # Run independent post-build gates concurrently. The codegen/link group
      # stays ordered because the byte-tie consumes the region-map ELF.
      - name: Post-build verification gates
        run: scripts/check-build-parallel.sh

      # Whole-library kernel-truth backstop — the "broader sweep of all of
      # EvmAsm/" noted as future work in scripts/check-axioms.sh, which remains
      # authoritative for the witnessed-surface policy. Taint findings are
      # report-only during the initial soak (advisory tier; promote by failing
      # on exit 1 too); infrastructure failures (exit != 1) always fail so the
      # soak cannot silently rot.
      - name: Axiom sweep (whole-library, report-only)
        run: |
          lake exe axiomsweep --self-test
          status=0
          lake exe axiomsweep --check || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning::axiomsweep found new axiom/sorry taint (report-only during soak)"
          elif [ "$status" -ne 0 ]; then
            echo "::error::axiomsweep infrastructure failure (exit $status) — not a taint verdict"
            exit "$status"
          fi

      # #12740: census of satisfiability witnesses for named `Assertion`
      # definitions (def ... : Assertion := ...). A twin is a theorem whose
      # name extends the definition by "_sat"/"_satisfiable" and whose TYPE
      # name-references the definition constant (structural tie, not a
      # restatement). Advisory by construction: satsweep itself always exits
      # 0 and only reports coverage (covered / restated / untwinned);
      # promotion to a drift gate (committed baseline + --check) is left for
      # the maintainer to decide.
      - name: Sat sweep (advisory coverage report)
        run: |
          status=0
          lake exe satsweep || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::satsweep infrastructure failure (exit $status) — not a coverage verdict"
            exit "$status"
          fi

      # #12747: footprint census (advisory, mirrors the axiomsweep soak tier).
      # Static census of contract/code contact surfaces: hypothesis-side
      # cps/ItemsSound contracts (where the knot defect class can live) and
      # callee programs whose written registers are unclaimed in the caller
      # pre. Complements satsweep (#12825): satsweep covers satisfiability of
      # named pres, footsweep covers footprint disclosure — neither subsumes
      # the other. Self-test first: an infrastructure failure (exit 2) fails
      # the step; census findings never fail the build (maintainer ruling
      # 2026-08-22: no standing CI gate).
      - name: Footprint sweep (report-only)
        run: |
          status=0
          lake exe footsweep --self-test || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::footsweep self-test failure (exit $status) — census not trustworthy"
            exit "$status"
          fi
          lake exe footsweep --out gen-out/footsweep-report.json || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::footsweep infrastructure failure (exit $status) — not a census verdict"
            exit "$status"
          fi

      # #12268/#12836: checks the reviewed GENERATORS registry for the guest
      # codegen artifact pipeline and names the stale artifact (fixture vs
      # source, tsv vs ELF, GuestAddrs vs tsv, GuestImageEntries vs MANIFEST+tsv,
      # pins vs ELF, transcription queue). Registry visibility and every
      # entry's negative control are self-tested; other generated ledgers have
      # their own gates. Blocking tier: deterministic, no network.
      - name: Derived-artifact consistency (self-test)
        run: |
          lake build codegen
          lake exe codegen --program stateless_guest --halt linux93 -o gen-out/regionmap/stateless_guest
          python3 scripts/check-derived-artifacts.py --self-test

      # Advisory only (no --strict, PR-only, best-effort on shallow clones):
      # surfaces theorem-statement and verifier-config edits for reviewers.
      - name: Statement / verifier-config tamper scan (advisory)
        if: ${{ github.event_name == 'pull_request' }}
        run: scripts/check-statement-tamper.sh --base "origin/${{ github.base_ref }}"

      # Advisory only (#11803): flags obligation-matrix blockers citing a CLOSED
      # issue. Needs network + `gh`, and skips cleanly when either is absent, so
      # it can never fail a run on infrastructure grounds.
      - name: Obligation-blocker staleness scan (advisory)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-obligation-blockers.sh

      # The `infra`-prose half of the same staleness class (#12129). Needs
      # neither network nor the kernel, so unlike the scan above it is strict.
      - name: Embedded registry counts in obligation prose
        run: scripts/check-embedded-counts.sh

      # The other side of the same coin (#12825). `check-embedded-counts.sh`
      # forbids RESTATING the registries' tallies in prose so the
      # `decide`-checked theorem stays the single source of truth; this checks
      # that source against the rows it claims to count. `decide` already makes
      # a wrong total unshippable -- what this adds is catching it in a second
      # instead of at the end of a ~50 minute build, because the failure mode is
      # a merge with NO conflict (two branches adding rows from one base both
      # write the same literal) and that fired four times on 2026-08-24.
      - name: Registry tallies match their row sets
        run: |
          python3 scripts/check-registry-tallies.py --self-test

      # #12857: a row's non-vacuity evidence must be inside the axiom gate. A
      # theorem named only in a row's notes/gate prose is audited by nothing --
      # `check-axioms.sh` sees only what a witness abbrev reaches -- so it could
      # acquire a `sorryAx` while the row kept citing it as the reason the gate
      # is satisfiable. Caught by hand three times in one week (#12813, #12820,
      # #12833) before this existed.
      - name: Non-vacuity citations are witnessed
        run: |
          python3 scripts/check-nonvacuity-witnessed.py --self-test

      # #13030: explicit typed evidence (non-vacuity instances, negative
      # controls, machine-body contracts and temporary module floors) must
      # name live declarations and the audit surface that actually checks
      # them.  This is deliberately separate from the row-driven citation
      # gate above: an evidence declaration with no row would otherwise be
      # invisible, while a source-print floor has not yet entered the witness
      # registry.
      - name: Typed evidence ledger
        run: |
          python3 scripts/check-evidence-ledger.py --self-test
          python3 scripts/check-evidence-ledger.py

      # #12926: semantic CPS/Hoare seam contracts are an explicit opt-in
      # surface.  A broad `Prop` census cannot identify them without hundreds
      # of false positives, so this gate checks the checked-in ledger: every
      # target is a real Prop declaration of its recorded shape, every missing
      # witness has an explicit reason, and supplied evidence is in the axiom
      # witness module.
      - name: Seam-contract ledger
        run: |
          python3 scripts/check-seam-contract-ledger.py --self-test

      # The remaining two classes of the same family (#12129): an `infra` blocker
      # claiming a symbol is UNCONVERTED when `GuestImageEntries.lean` lists it,
      # and a hand-written `.text` coverage percentage in PLAN.md or
      # Obligations.lean when that figure is generated. Strict for the same
      # reason as the step above — every check is local and deterministic (tree
      # text + a generated report), with no network and no `gh`, so a red here is
      # always a real finding and never an infrastructure skip. A gate that
      # cannot go red is not a gate.
      - name: Falsifiable obligation claims
        run: scripts/check-obligation-claims.sh --self-test
      - name: Falsifiable obligation claims (gate)
        run: scripts/check-obligation-claims.sh --strict

      # Only push to main / merge_group / workflow_dispatch save, so PR runs
      # cannot churn the quota and evict the main-branch entries (#1441).
      # Each save's path list must match its restore list above exactly.
      - name: Save dependency cache (.lake/packages)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: .lake/packages
          key: lake-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
        continue-on-error: true

      - name: Save lake build cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
