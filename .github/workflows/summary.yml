name: 'PR Summary'

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Own checkout, ahead of the summary action's own, so the steps below can
      # read the repo (CONTRIBUTING.md, the prompt file) and diff base↔head.
      # Files written to /tmp survive the action's checkout (which only touches
      # the workspace).
      #
      # REMOVED IN #12683: a "Compute deterministic progress delta" step used to
      # run here, rendering base↔head count/tier deltas from the COMMITTED
      # PROGRESS.md blobs at both SHAs (`scripts/progress-delta.sh`, pinned to
      # the trusted base copy because this workflow holds a write token + the
      # OPENROUTER_KEY). PROGRESS.md is no longer committed, and the delta is not
      # reconstructible here: computing the head-side numbers means RUNNING the
      # PR's own Lean tree under `pull_request_target`, which is exactly the
      # secret-exfiltration shape that hardening forbade. So the deterministic
      # delta section of the PR summary is GONE, not relocated — the LLM
      # summary keeps working, with one fewer factual input. The kernel-checked
      # counts still move under the drift gate on DRIFT.md, and the nightly
      # progress-history series still records them per day.
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Required by actions/checkout when pull_request_target checks out a
          # fork PR head (GH #10703). No PR-head script is executed by this
          # workflow: the steps below only read files and run git. Opt-in
          # restores fork-PR summaries; it does not widen script execution.
          allow-unsafe-pr-checkout: true

      - name: Build augmented instructions file
        run: |
          # Concatenate (in order):
          #   1. CONTRIBUTING.md       — existing style guidance
          #   2. pr-summary-progress-prompt.md — LLM output-shape rules
          #
          # (A third input, the deterministic progress delta, was dropped in
          # #12683 — see the note on the checkout step above.)
          #
          # The LLM consumes this as its analysis-time context.
          # Sections are separated by horizontal rules so the model
          # can tell them apart in the synthesis prompt.
          {
            echo "# Deployment-supplied instructions for evm-asm"
            echo
            echo "## Style guidance (from CONTRIBUTING.md)"
            echo
            cat CONTRIBUTING.md
            echo
            echo "---"
            echo
            cat docs/pr-summary-progress-prompt.md
          } > /tmp/augmented-instructions.md
          echo "Built /tmp/augmented-instructions.md ($(wc -l < /tmp/augmented-instructions.md) lines)"

      - name: Detect unsupported directory diffs
        id: summary_guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          skip=false
          while IFS= read -r path; do
            if [[ -d "$path" ]]; then
              echo "PR summary skipped: $path is a directory or submodule path"
              skip=true
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Generate PR Summary
        if: steps.summary_guard.outputs.skip != 'true'
        uses: alexanderlhicks/lean4repo-utils/summary@0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_KEY }}
          # model: inherits the action default (deepseek/deepseek-v4-flash).
          #        Set `model: <openrouter-slug>` here to override for this repo only.
          github_repository: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}
          additional_instructions_path: '/tmp/augmented-instructions.md'
          validate_title: 'true'
