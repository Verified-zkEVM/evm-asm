name = "EvmAsm"
version = "0.1.0"
defaultTargets = ["EvmAsm"]
leanOptions = []

# Prebuilt-olean release cache (see docs/build-cache.md). Lake only consults these
# for EvmAsm consumed as a dependency pinned at a release tag; the root build is
# unaffected. Each GitHub release carries one platform-independent archive of the
# EvmAsm library's build artifacts, published by .github/workflows/release-oleans.yml.
preferReleaseBuild = true
releaseRepo = "https://github.com/Verified-zkEVM/evm-asm"
# One archive serves every platform (the EvmAsm lib below is platformIndependent);
# without this Lake would look for a per-platform `EvmAsm-{platform}.tar.gz`.
buildArchive = "EvmAsm-oleans.tar.gz"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Pin the tag matching lean-toolchain: mathlib master tracks the next rc, so an
# unpinned `lake update` would overshoot the toolchain. Bump both together.
rev = "v4.33.0"

# Release-pinned scoped RV64IM Sail extraction. Its release archive contains
# platform-independent oleans, so ordinary EvmAsm builds do not recompile the
# generated `RiscvZkvm.Sail` library. Regeneration and provenance live in
# riscv-zkvm.
[[require]]
name = "riscv-zkvm"
git = "https://github.com/Verified-zkEVM/riscv-zkvm"
rev = "v0.2.0"

[[lean_lib]]
name = "EvmAsm"
# Release archives are built on Linux CI and consumed on every platform: this drops
# platform-dependent elements from module traces so those oleans validate on macOS
# and Windows too (Mathlib uses the same mechanism). Declared on the library rather
# than the package so it does not also claim platform independence for the lean_exe
# targets below, whose native output genuinely is platform-specific.
platformIndependent = true
# clang's default -fbracket-depth=256 trips on the deeply-nested
# C ternary chain that Lean emits for the `lookupProgram` /
# `lookupProgramTail` `match` cascade.  Each new probe arm adds
# one bracket layer; we already brush the limit at ~240 arms.
moreLeancArgs = ["-fbracket-depth=4096"]

[[lean_exe]]
name = "codegen"
root = "Main"
supportInterpreter = true

[[lean_exe]]
name = "progress-report"
root = "MainProgress"
supportInterpreter = true

[[lean_exe]]
name = "div128-v5-check"
root = "MainDiv128V5Check"
supportInterpreter = true

[[lean_exe]]
name = "arith-diff-check"
root = "MainArithDiffCheck"
supportInterpreter = true

[[lean_exe]]
name = "rlp-diff-check"
root = "MainRlpDiffCheck"
supportInterpreter = true

[[lean_exe]]
name = "correspondence-check"
root = "MainCorrespondenceCheck"
supportInterpreter = true

[[lean_exe]]
name = "specref-eest-check"
root = "MainSpecRefEestCheck"
supportInterpreter = true

# Whole-library kernel-level axiom / sorry accounting; see scripts/AxiomSweep.lean.
# Complements scripts/check-axioms.sh (which stays authoritative for the witnessed
# progress-registry policy). Runtime-imports built oleans: run after `lake build`.
[[lean_exe]]
name = "axiomsweep"
srcDir = "scripts"
root = "AxiomSweep"
supportInterpreter = true

# Advisory satisfiability-witness coverage census for named `Assertion`
# definitions (GH #12740 Tier A): which pre definitions have a
# name-referencing `_sat`/`_satisfiable` twin.  Always exits 0 on a
# successful walk; runtime-imports built oleans, run after `lake build`.
[[lean_exe]]
name = "satsweep"
srcDir = "scripts"
root = "SatSweep"
supportInterpreter = true

# Statement-keyed CPS proof candidate census and registry/exclusion ownership gate
# for GH #12210 part 2.  This intentionally remains a separate executable so the
# candidate detector cannot become dependent on the registry it audits.
[[lean_exe]]
name = "witness-candidates"
srcDir = "scripts"
root = "WitnessCandidates"
supportInterpreter = true

# Advisory footprint census for GH #12747: contracts that do not say what the
# code touches (unanchored contract abbrevs, hypothesis-side contracts, and
# per-site untied-parameter / unclaimed-register signatures).  Complements
# satsweep (#12740): satsweep covers satisfiability, footsweep covers
# footprint.  Advisory by construction (exit 0 on a successful walk).
[[lean_exe]]
name = "footsweep"
srcDir = "scripts"
root = "FootSweep"
supportInterpreter = true
