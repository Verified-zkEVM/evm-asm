name = "EvmAsm"
version = "0.0.1"
defaultTargets = ["EvmAsm"]
leanOptions = []

[[require]]
name = "mathlib"
scope = "leanprover-community"

# Vendored scoped RV64IM Sail-extracted Lean model (package "out", lib "Out").
# Generated by scripts/regen-sail-model.sh; pins lean-sail v4 (79b4d08). Provenance
# in sail-import/PROVENANCE.toml [target]. Replaces the moving dhsorens fork.
[[require]]
name = "out"
path = "vendor/sail-riscv-zkvm-lean"

[[lean_lib]]
name = "EvmAsm"
# clang's default -fbracket-depth=256 trips on the deeply-nested
# C ternary chain that Lean emits for the `lookupProgram` /
# `lookupProgramTail` `match` cascade.  Each new probe arm adds
# one bracket layer; we already brush the limit at ~240 arms.
moreLeancArgs = ["-fbracket-depth=4096"]

[[lean_exe]]
name = "codegen"
root = "Main"
supportInterpreter = true

[[lean_exe]]
name = "progress-report"
root = "MainProgress"
supportInterpreter = true

[[lean_exe]]
name = "div128-v5-check"
root = "MainDiv128V5Check"
supportInterpreter = true

[[lean_exe]]
name = "arith-diff-check"
root = "MainArithDiffCheck"
supportInterpreter = true

[[lean_exe]]
name = "rlp-diff-check"
root = "MainRlpDiffCheck"
supportInterpreter = true

[[lean_exe]]
name = "correspondence-check"
root = "MainCorrespondenceCheck"
supportInterpreter = true

[[lean_exe]]
name = "specref-eest-check"
root = "MainSpecRefEestCheck"
supportInterpreter = true

# Whole-library kernel-level axiom / sorry accounting; see scripts/AxiomSweep.lean.
# Complements scripts/check-axioms.sh (which stays authoritative for the witnessed
# progress-registry policy). Runtime-imports built oleans: run after `lake build`.
[[lean_exe]]
name = "axiomsweep"
srcDir = "scripts"
root = "AxiomSweep"
supportInterpreter = true

# Statement-keyed CPS proof candidate census and registry/exclusion ownership gate
# for GH #12210 part 2.  This intentionally remains a separate executable so the
# candidate detector cannot become dependent on the registry it audits.
[[lean_exe]]
name = "witness-candidates"
srcDir = "scripts"
root = "WitnessCandidates"
supportInterpreter = true
