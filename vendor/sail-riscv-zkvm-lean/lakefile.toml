# Vendored scoped RV64IM Lean model, Sail-extracted from riscv/sail-riscv.
#
# Generated by scripts/regen-sail-model.sh (Sail 0.20.2 on OCaml 5.4.1, sail-riscv
# release tag 2026-06-22-b5a2182, modules: main I_insts M_insts). Provenance +
# pins recorded in sail-import/PROVENANCE.toml [target]. To regenerate, re-run the
# script and re-copy Out/ + Out.lean (this lakefile/lean-toolchain are hand-owned).
#
# The model imports the EXTERNAL lean-sail runtime (`import Sail.Sail`); pinned by
# commit below. Package/lib names ("out"/"Out") are kept verbatim from the proven
# artifact — renaming would rewrite every internal `import Out.*`.
name = "out"
defaultTargets = ["Out"]
moreLeanArgs = ["--tstack=400000"]

[[lean_lib]]
name = "Out"
leanOptions.weak.linter.style.nameCheck = false
moreLeancArgs = ["-fbracket-depth=500"]

# lean-sail v4 (79b4d08) + a 2-line fix for the Lean >= v4.32 do-elaborator
# (readRegRef/writeRegRef dependent match), pinned on the dhsorens fork's
# v4-lean4.33 branch. Upstream main (v5) restructured past what the vendored
# model was generated against, so the v4 lineage is patched rather than bumped.
[[require]]
name = "Sail"
git = "https://github.com/dhsorens/lean-sail"
rev = "8d57a8b537f1a4e7cdf558c3d87a79f453bf3817"
